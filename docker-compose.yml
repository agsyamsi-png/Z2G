services:
  z2g:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: z2g-migration-engine
    restart: unless-stopped
    ports:
      - "80:3000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
      - ./.env.local:/app/.env.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
